name: Go companion
on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/go.mod'
      - '.github/workflows/build-companion.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./cmd/test
      - run: go run ./cmd/test vet
      - name: Install VLC on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y vlc
          echo "VLC_BINARY=/usr/bin/vlc" >> "$GITHUB_ENV"
      - name: Install VLC on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask vlc
          if xattr -p com.apple.quarantine /Applications/VLC.app >/dev/null 2>&1; then
            xattr -dr com.apple.quarantine /Applications/VLC.app
          fi
          echo "VLC_BINARY=/Applications/VLC.app/Contents/MacOS/VLC" >> "$GITHUB_ENV"
      - name: Install VLC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vlc --no-progress -y --timeout=600
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "VLC installation failed" }
          $vlc = Join-Path $env:ProgramFiles 'VideoLAN\VLC\vlc.exe'
          if (!(Test-Path $vlc)) { throw "VLC executable not found at $vlc" }
          "VLC_BINARY=$vlc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real VLC and native Discord IPC integration
        env:
          DISCORD_VLC_RPC_INTEGRATION: '1'
        run: go run ./cmd/test -v -count=1 -timeout=3m -run 'TestNativeDiscordIPC|TestRealVLCPlayback' ./modules
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./cmd/build release-go
      - uses: actions/upload-artifact@v4
        with:
          name: companion-platform-packages
          path: release-go/*.zip
